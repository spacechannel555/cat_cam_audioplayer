<!DOCTYPE html>
<html>
<head>
    <meta charset = 'utf-8'>
    <title>Cat Cam Audio Player</title>
    <link rel= "icon" type="image/jpeg" href="assets/cat_cam_reg.jpg">
    <style>
        h1 {
            font-family: Tahoma, sans-serif;
            margin-top: 75px;
        }
        body {
            text-align: center;
        }
        section {
            margin-top: 115px;
        }
    </style>
</head>
<body>
    <h1>Hover Over Me!!!! :D</h1>
    <section>
        <img id= "cat-cam" src="assets/cat_cam_reg.jpg" width="292.5" height="285" alt="Cat Cam Talking Closed Mouth">
    </section>
    
    <audio id="club-classics" src="charli xcx - club classics.mp3" preload="auto"></audio>

    <script>
        const ogCatCam = "assets/cat_cam_reg.jpg";

        const slides = [
            { img: "assets/sunny_cat_blue.JPEG", bg: "#89B1B0"},
            { img: "assets/sunny_cat_red.JPEG", bg: "#C18177"},
            { img: "assets/sunny_cat_purple.JPEG", bg: "#9A80AF"},
            { img:"assets/sunny_cat_green.JPEG", bg: "#88B978"}
        ];

        const catCam = document.getElementById("cat-cam");

        const bgm = document.getElementById("club-classics");

        let currentIndex = 0;
        let slideInterval = null;

        slides.forEach(src => {
            const img = new Image();
            img.width = 292.5; 
            img.height= 285;
            img.src = src;
        });

        catCam.addEventListener("mouseenter", () => {
            currentIndex = 0;
            catCam.src = slides[currentIndex].img;
            document.body.style.backgroundColor = slides[currentIndex].bg;

            bgm.play().catch(error => {
                console.log("Audio playback error:", error);
            });

            slideInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % slides.length;

                catCam.src = slides[currentIndex].img;

                document.body.style.backgroundColor = slides[currentIndex].bg;
            }, 1200);
        });

        catCam.addEventListener("mouseleave", () => {
            clearInterval(slideInterval);
            slideInterval = null;

            bgm.pause();

            catCam.src = ogCatCam;

            document.body.style.backgroundColor = "";
        });
    </script>
</body>
</html>
