<!DOCTYPE html>
<html>
<head>
    <meta charset = 'utf-8'>
    <title>Cat Cam Audio Player</title>
    <link rel= "icon" type="image/jpeg" href="cat_cam_reg.jpg">
    <style>
        h1 {
            font-family: Tahoma, sans-serif;
            margin-top: 75px;
        }
        body {
            text-align: center;
        }
        section {
            margin-top: 115px;
        }
        #audio-prompt {
            margin-top: 20px;
        }
        #enable-audio {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Hover Over Me!!!! :D</h1>
    <div id = "audio-prompt">
        <button id = "enable-audio">Enable Audio 🔊</button>
    </div>
    <section>
        <img id= "cat-cam" src="cat_cam_reg.jpg" width="292.5" height="285" alt="Cat Cam Talking Closed Mouth">
    </section>
    
    <audio id="club-classics" src="charli xcx - club classics.mp3" preload="auto"></audio>

    <script>
        const ogCatCam = "cat_cam_reg.jpg";

        const slides = [
            { img: "sunny_cat_blue.JPEG", bg: "#89B1B0"},
            { img: "sunny_cat_red.JPEG", bg: "#C18177"},
            { img: "sunny_cat_purple.JPEG", bg: "#9A80AF"},
            { img:"sunny_cat_green.JPEG", bg: "#88B978"}
        ];

        const catCam = document.getElementById("cat-cam");

        const bgm = document.getElementById("club-classics");

        const audioPrompt = document.getElementById("audio-prompt");
        
        const enableAudio = document.getElementById("enable-audio");

        let audioEnabled = false;

        let currentIndex = 0;
        let slideInterval = null;

        slides.forEach(src => {
            const img = new Image();
            img.width = 292.5; 
            img.height= 285;
            img.src = src;
        });

        enableAudio.addEventListener("click", async () => {
            try {
                await bgm.play();
                audioEnabled = true;
                bgm.pause();
                audioPrompt.style.display = "none";
            } catch (error) {
                console.log("Unable to enable audio:", error);
            }
        });
        
        catCam.addEventListener("mouseenter", () => {
            currentIndex = 0;
            catCam.src = slides[currentIndex].img;
            document.body.style.backgroundColor = slides[currentIndex].bg;

            if (audioEnabled) {
                bgm.play().catch(error => {
                    console.log("Audio Playback Error:", error);
                });
            }

            slideInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % slides.length;

                catCam.src = slides[currentIndex].img;

                document.body.style.backgroundColor = slides[currentIndex].bg;
            }, 1200);
        });

        catCam.addEventListener("mouseleave", () => {
            clearInterval(slideInterval);
            slideInterval = null;

            bgm.pause();

            catCam.src = ogCatCam;

            document.body.style.backgroundColor = "";
        });
    </script>
</body>
</html>
